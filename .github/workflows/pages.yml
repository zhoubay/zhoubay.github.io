name: Pages

on:
  push:
    branches: [master]
  schedule:
    # Check daily at 10:17 Beijing time; refresh only after three UTC calendar days.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Share one deployment queue; queued runs always check out the latest master.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check_schedule:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.interval.outputs.should_run }}
      refresh_scholar: ${{ steps.interval.outputs.refresh_scholar }}
      refresh_huggingface: ${{ steps.interval.outputs.refresh_huggingface }}
    steps:
      - name: Check out latest master
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Check each metric's three-day refresh interval
        id: interval
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/check_metric_schedule.py --event "$EVENT_NAME"

  build:
    needs: check_schedule
    if: github.ref == 'refs/heads/master' && needs.check_schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      scholar_result: ${{ steps.scholar.outcome }}
      huggingface_result: ${{ steps.huggingface.outcome }}
    steps:
      - name: Check out latest master
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-scholar.txt

      - name: Install Scholar updater dependencies
        run: python -m pip install -r scripts/requirements-scholar.txt

      - name: Test metric updaters and refresh schedule without network requests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Refresh Scholar snapshot via SearchApi
        id: scholar
        if: needs.check_schedule.outputs.refresh_scholar == 'true'
        continue-on-error: true
        env:
          SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
        run: python scripts/update_scholar.py --config _config.yml --output _data/scholar.json

      - name: Refresh Hugging Face lifetime download snapshot
        id: huggingface
        if: needs.check_schedule.outputs.refresh_huggingface == 'true'
        continue-on-error: true
        run: python scripts/update_huggingface.py --output _data/huggingface.json

      - name: Summarize metric refreshes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SCHOLAR_RESULT: ${{ steps.scholar.outcome }}
          HUGGINGFACE_RESULT: ${{ steps.huggingface.outcome }}
        run: |
          {
            echo "| Source | Refresh result |"
            echo "| --- | --- |"
            echo "| Google Scholar | $SCHOLAR_RESULT |"
            echo "| Hugging Face | $HUGGINGFACE_RESULT |"
            echo
            echo "Failed refreshes keep the previous snapshot; other successful updates can still be published."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCHOLAR_RESULT" = failure ] || [ "$HUGGINGFACE_RESULT" = failure ]; then
            echo "::warning::A metric refresh failed. Continuing with its previous snapshot; failure will be reported after the deployment attempt."
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Ensure master did not change during the build
        run: |
          git fetch --no-tags origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "master changed during the build; leaving the published site unchanged."
            exit 1
          fi

      - name: Save successfully built metric snapshots
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SCHOLAR_RESULT: ${{ steps.scholar.outcome }}
          HUGGINGFACE_RESULT: ${{ steps.huggingface.outcome }}
        run: |
          snapshot_paths=()
          if [ "$SCHOLAR_RESULT" = success ] && [ -f _data/scholar.json ]; then
            snapshot_paths+=(_data/scholar.json)
          fi
          if [ "$HUGGINGFACE_RESULT" = success ] && [ -f _data/huggingface.json ]; then
            snapshot_paths+=(_data/huggingface.json)
          fi
          if [ "${#snapshot_paths[@]}" -eq 0 ]; then
            echo "No successfully refreshed snapshots to save."
            exit 0
          fi
          git add -- "${snapshot_paths[@]}"
          if ! git diff --cached --quiet -- "${snapshot_paths[@]}"; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update Scholar and Hugging Face metrics" -- "${snapshot_paths[@]}"
            git push origin HEAD:master
          fi

      - name: Record the source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure the artifact still matches master
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          if [ "$remote_sha" != "$BUILT_SHA" ]; then
            echo "master changed after the build; leaving the published site unchanged."
            exit 1
          fi

      # Bot commits do not trigger another workflow, so deploy in this run.
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report_refresh_failures:
    # Report a failed source after allowing the other source's data to deploy.
    needs: [build, deploy]
    if: >-
      always() &&
      (needs.build.outputs.scholar_result == 'failure' || needs.build.outputs.huggingface_result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Report failed metric refreshes
        env:
          SCHOLAR_RESULT: ${{ needs.build.outputs.scholar_result }}
          HUGGINGFACE_RESULT: ${{ needs.build.outputs.huggingface_result }}
        run: |
          if [ "$SCHOLAR_RESULT" = failure ]; then
            echo "::error::Google Scholar refresh failed; its previous snapshot was retained. See the build job for the cause."
          fi
          if [ "$HUGGINGFACE_RESULT" = failure ]; then
            echo "::error::Hugging Face refresh failed; its previous snapshot was retained. See the build job for the cause."
          fi
          exit 1
