name: Pages

on:
  push:
    branches: [master]
  schedule:
    # Primary: 10:17 Beijing time (UTC+8).
    - cron: "17 2 * * *"
    # Afternoon backup: 16:43 Beijing time (UTC+8).
    - cron: "43 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Share one deployment queue; queued runs always check out the latest master.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out latest master
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-scholar.txt

      - name: Install Scholar updater dependencies
        run: python -m pip install -r scripts/requirements-scholar.txt

      - name: Test Scholar updater without network requests
        run: python -m unittest discover -s tests -p 'test_update_scholar.py'

      - name: Refresh Scholar snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/update_scholar.py --config _config.yml --output _data/scholar.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Ensure master did not change during the build
        run: |
          git fetch --no-tags origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "master changed during the build; leaving the published site unchanged."
            exit 1
          fi

      - name: Save successfully built Scholar snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add -- _data/scholar.json
          if ! git diff --cached --quiet -- _data/scholar.json; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update Google Scholar metrics" -- _data/scholar.json
            git push origin HEAD:master
          fi

      - name: Record the source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure the artifact still matches master
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          if [ "$remote_sha" != "$BUILT_SHA" ]; then
            echo "master changed after the build; leaving the published site unchanged."
            exit 1
          fi

      # Bot commits do not trigger another workflow, so deploy in this run.
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
