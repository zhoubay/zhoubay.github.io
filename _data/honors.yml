- text: "**Oct 2025** — **Best Poster Award**, [*Nature Conference on AI Augmented Biology*](https://natureconferences.streamgo.live/ai-augmented-biology/register) (organised by [Nanjing University](https://www.nju.edu.cn/) with *Nature*, *Nature Biotechnology*, *Nature Methods*, and *Nature Communications*; 22–24 Oct 2025, Nanjing, China). Poster on [Evolla](/publication/Evolla): [[PDF](/files/Evolla_poster_2025.pdf)]"
  i18n:
    zh:
      text: '**2025年10月** — [*Nature 人工智能增强生物学会议*](https://natureconferences.streamgo.live/ai-augmented-biology/register)**最佳海报奖**。会议由[南京大学](https://www.nju.edu.cn/)与
        *Nature*、*Nature Biotechnology*、*Nature Methods* 和 *Nature Communications* 联合举办，2025年10月22日至24日于中国南京举行。获奖海报介绍 [Evolla](/zh/publication/Evolla)：[[PDF](/files/Evolla_poster_2025.pdf)]'
