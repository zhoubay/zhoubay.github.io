  zh:
    summary: |
      西湖大学计算机科学博士生，致力于开发用于计算生物学的**蛋白质语言模型**与 AI 系统。研究涵盖结构感知预训练（SaProt，ICLR 2024）、三模态蛋白质检索（ProTrek，*Nature Biotechnology* 2025）、降低使用门槛的蛋白质语言模型平台（SaprotHub，*Nature Biotechnology* 2025）、蛋白质语言模型辅助碱基编辑（*Molecular Cell* 2024），以及前沿生成模型（Pinal，*Nature* 2026；Evolla，正在 *Nature* 审稿中）。
pdf_zh: /latex_files/cv-zh/main.pdf

summary: |
  Ph.D. candidate developing **protein language models** and AI systems for computational biology at Westlake University. Research spans structure-aware pretraining (SaProt, ICLR 2024), trimodal protein search (ProTrek, *Nature Biotechnology* 2025), democratized PLM platforms (SaprotHub, *Nature Biotechnology* 2025), PLM-assisted base editing (*Molecular Cell* 2024), and frontier generative models (Pinal, *Nature* 2026; Evolla, under review at *Nature*).

