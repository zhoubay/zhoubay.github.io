    这是一个静态学术网站，不提供用户账户、评论表单或邮件订阅服务。如果您对本政策有疑问，请通过 [{{ site.author.email }}](mailto:{{ site.author.email }}) 联系我。

    ## 收集的信息 {#what-we-collect}

    您浏览本站时，下述网站统计服务可能收集以下使用信息：

    - 浏览的页面及大致停留时间
    - 大致地理区域（根据 IP 地址推算）
    - 浏览器、设备类型与操作系统
    - 来源网站或搜索来源

    我不会通过本网站主动收集姓名、电子邮箱地址或其他可直接识别个人身份的信息。GitHub Pages 在正常运行过程中维护的服务器及托管日志，也可能记录 IP 地址与请求元数据。

    ## Google Analytics 4 {#google-analytics-4}

    本站使用 [Google Analytics 4](https://support.google.com/analytics/)（衡量 ID：**G-HQ0RZENN0C**）了解访客如何使用网站，并据此改进内容。Google 可能使用 Cookie 或类似技术，并按照其自身政策处理数据。

    - [Google 隐私政策](https://policies.google.com/privacy)
    - [Google Analytics 数据隐私说明](https://support.google.com/analytics/answer/6004245)
    - [用于停用 Google Analytics 的浏览器插件](https://tools.google.com/dlpage/gaoptout)

    您加载本站页面时，网站统计功能默认运行。我不会出售访客数据。

    {% assign baidu_tracking_id = site.analytics.baidu.tracking_id | default: "" | strip %}
    {% if site.analytics.provider and baidu_tracking_id != "" %}
    ## 百度统计 {#baidu-tongji}

    本站也使用[百度统计](https://tongji.baidu.com/)统计访问情况、来源网站与大致地理区域。百度可能处理您的 IP 地址、浏览器与设备信息、访问页面和来源信息，并可能使用 Cookie 或类似技术。其数据处理方式详见[百度统计隐私政策](https://tongji.baidu.com/web/help/article?id=330&type=0)。

    {% endif %}
    ## 其他第三方服务 {#other-third-party-services}

    **Google Fonts**：本站从 Google（`fonts.googleapis.com` / `fonts.gstatic.com`）加载字体。请求字体时，Google 可能会收到您的 IP 地址。详见 [Google 隐私政策](https://policies.google.com/privacy)。

    **GitHub Pages**：本站托管于 [GitHub Pages](https://pages.github.com/)。GitHub 可能按照 [GitHub 隐私声明](https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement)处理技术日志数据。

    本站未嵌入 Disqus、广告网络或社交账号登录组件。

    ## Cookie {#cookies}

    Cookie 和类似存储技术主要用于上述网站统计服务。您可以在浏览器设置中阻止或删除 Cookie。阻止 Cookie 可能影响统计功能，但通常不会妨碍您阅读公开页面。

    ## 您可以作出的选择 {#your-choices}

    您可以：

    - 在浏览器设置中阻止或清除 Cookie
    - 安装[用于停用 Google Analytics 的浏览器插件](https://tools.google.com/dlpage/gaoptout)
    - 如果不希望被收集网站统计数据，停止访问本站

    ## 政策变更 {#changes-to-this-policy}

    最后更新：**{{ page.last_updated | default: "now" | date: "%Y-%m-%d" }}**。我可能会不定期修订此页面，更新后的政策将在此网址发布。

