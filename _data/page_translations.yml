page.terms:
  title: 隐私政策
  description: zhoubay.github.io 的隐私政策：网站统计、Cookie 与第三方服务。
  content: |
    {% include base_path %}

    <div class="page-shell fade-in" markdown="1">

    本隐私政策说明 [zhoubay.github.io]({{ '/' | locale_url: page.lang | absolute_url }})（周禧彬的个人学术主页）在您访问网站时如何处理相关信息。

