{% if site.url %}
  {% assign schema_url = site.url | append: site.baseurl %}
{% endif %}
{% assign schema_url = schema_url | default: site.github.url %}
{% if schema_url and site.social.links %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": {{ schema_url | append: "/#person" | jsonify }},
  "name": {{ site.social.name | default: site.author.name | jsonify }},
  "alternateName": ["周禧彬", "Xibin Zhou"],
  "url": {{ schema_url | jsonify }},
  "email": {{ site.author.email | jsonify }},
  "jobTitle": {{ "Ph.D. Candidate in Computer Science" | t: page.lang | jsonify }},
  "description": {{ site.description | t: page.lang | jsonify }},
  "image": {{ site.og_image | prepend: "/images/" | prepend: schema_url | jsonify }},
  "affiliation": {
    "@type": "Organization",
    "name": {{ "Westlake University" | t: page.lang | jsonify }},
    "url": "https://www.westlake.edu.cn/"
  },
  "worksFor": {
    "@type": "Organization",
    "name": {{ "Westlake University" | t: page.lang | jsonify }}
  },
  "knowsAbout": [
    {{ "Protein language models" | t: page.lang | jsonify }},
    {{ "AI for Science" | t: page.lang | jsonify }},
    {{ "Multimodal protein AI" | t: page.lang | jsonify }},
    {{ "Computational biology" | t: page.lang | jsonify }},
    {{ "Protein engineering" | t: page.lang | jsonify }}
  ],
  "sameAs": {{ site.social.links | jsonify }}
}
</script>
{% endif %}
