{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="{{ 'Main navigation' | t: page.lang }}">
        <button aria-label="{{ 'More navigation links' | t: page.lang }}"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ locale_path }}/">{{ site.title | t: page.lang }}</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{% if link.url contains 'http' %}{{ link.url }}{% else %}{{ link.url | locale_url: page.lang | prepend: base_path }}{% endif %}">{{ link.title | t: page.lang }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      {% include language-switcher.html %}
    </div>
  </div>
</div>
