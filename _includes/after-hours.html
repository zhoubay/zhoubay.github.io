<div class="after-hours" data-after-hours lang="en" hidden>
  <div class="after-hours__stage" id="after-hours-stage" hidden>
    <canvas class="after-hours__water" aria-hidden="true"></canvas>
    <div class="after-hours__message">
      <span class="after-hours__eyebrow">OFF THE CLOCK</span>
      <h2 id="after-hours-title">
        <span lang="en">Let the papers drift.</span>
        <span lang="zh-CN">论文先漂一会儿。</span>
      </h2>
      <p>
        <span lang="en">That's enough research for today.</span>
        <span lang="zh-CN">今天的研究，就到这里。</span>
      </p>
    </div>
    <aside class="after-hours__boss" aria-hidden="true" hidden>
      <div class="after-hours__boss-heading">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
          <path d="M2 12h3m14 0h3M10 12h4M4 11l1-5m15 5-1-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="7" cy="13" r="4" stroke="currentColor" stroke-width="1.6" />
          <circle cx="17" cy="13" r="4" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <span lang="en">The boss</span>
        <span lang="zh-CN">老板</span>
        <span class="after-hours__boss-number" lang="en">PI</span>
      </div>
      <p class="after-hours__boss-quote" lang="en">One more experiment before you go?</p>
      <p class="after-hours__boss-translation" lang="zh-CN">下班前，再跑一组实验？</p>
      <span class="after-hours__boss-stamp" lang="en">QUICK REQUEST</span>
    </aside>
    <div class="after-hours__fleet" role="group" aria-label="Paper boats / 论文纸船"></div>
    <div class="after-hours__caption">
      <p class="after-hours__hint">
        <span lang="en">Make a ripple. Send a paper sailing.</span>
        <span lang="zh-CN">拨一拨水，送论文去远航。</span>
      </p>
      <p class="after-hours__note" role="status" aria-live="polite" aria-atomic="true">
        <span lang="en"></span>
        <span lang="zh-CN"></span>
      </p>
    </div>
  </div>
  <button class="after-hours__toggle" type="button" aria-expanded="false" aria-controls="after-hours-stage">
    <svg viewBox="0 0 32 32" width="24" height="24" fill="none" aria-hidden="true">
      <path d="M5 18h22l-5 7H10z" fill="currentColor" opacity=".22" />
      <path d="m7 18 9-13 9 13M16 5v13M5 18h22l-5 7H10zM3 28c3-3 6 3 9 0s6 3 9 0 5 2 8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="after-hours__toggle-label" data-after-hours-toggle-label>
      <span lang="en">Off the clock</span>
      <span lang="zh-CN">下班了</span>
    </span>
  </button>
</div>
