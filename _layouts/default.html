---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ page.lang | default: "en" }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    {% if page.math %}
      {% include mathjax.html %}
    {% endif %}
  </head>

  <body data-page-key="{{ page.translation_key }}" class="{% if page.layout %}layout--{{ page.layout }}{% endif %}{% if page.classes %}{% for c in page.classes %} layout--{{ c }}{% endfor %}{% endif %}">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
